[project]
name = "ai-hedge-fund"
version = "0.1.0"
description = "AI hedge fund — LLM research, SQLite portfolio, weighted risk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openbb[yfinance]>=4.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "click>=8.1",
    "yfinance>=0.2",
    "pandas-datareader>=0.10",
    "finnhub-python>=2.4",
    "twelvedata>=1.2",
    "alpha_vantage>=3.0",
    "setuptools>=82.0.1",
    "sqlalchemy>=2.0",
    "sentry-sdk[fastapi]>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]
openai = [
    "openai>=1.59",
]
bist = [
    "borsapy>=0.8",
]
sentiment = [
    "transformers>=4.40",
    "torch>=2.0",
]

[project.scripts]
check-data = "hedge_fund.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedge_fund"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
