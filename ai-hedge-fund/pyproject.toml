[project]
name = "ai-hedge-fund"
version = "0.1.0"
description = "AI hedge fund — LLM research, SQLite portfolio, weighted risk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openbb[yfinance]>=4.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "click>=8.1",
    "yfinance>=0.2",
    "pandas-datareader>=0.10",
    "finnhub-python>=2.4",
    "twelvedata>=1.2",
    "alpha_vantage>=3.0",
    "setuptools>=82.0.1",
    "sqlalchemy>=2.0",
    "sentry-sdk[fastapi]>=2.19",
    "scipy>=1.17.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "mypy>=1.14",
    "ruff>=0.9",
]
openai = [
    "openai>=1.59",
]
bist = [
    "borsapy>=0.8",
]
sentiment = [
    "transformers>=4.40",
    "torch>=2.0",
]

[project.scripts]
check-data = "hedge_fund.cli:main"
hedge-fund-mcp = "hedge_fund.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedge_fund"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
# Third-party stubs are patchy across this dependency set (pandas, openbb,
# yfinance); missing imports are not a signal about this code.
ignore_missing_imports = true

# Type checking is opt-in by package, not repo-wide. Everything listed here
# passes under the strict flags below, and the list is the ratchet: widen it one
# package at a time rather than weakening the flags to admit the next one.
files = ["src/hedge_fund/plan", "src/hedge_fund/agents"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
