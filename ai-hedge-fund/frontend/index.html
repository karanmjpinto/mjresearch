<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MJ Research</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bricolage Grotesque carries the prose; Departure Mono (self-hosted,
         see src/index.css) carries display, numerals and labels. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- GitHub Pages SPA redirect — restores path from 404.html query param -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?p= query param set by 404.html
        var search = window.location.search;
        if (search.slice(1, 3) === "p=") {
          var decoded = search.slice(1).split("&").map(function (s) { return s.replace(/~and~/g, "&"); });
          window.history.replaceState(null, null,
            window.location.pathname.slice(0, -1) +
            (decoded[0] ? "/" + decoded[0].slice(2) : "") +
            (decoded[1] ? "?" + decoded[1].slice(2) : "") +
            window.location.hash
          );
        }
      })();
    </script>
  </head>
  <!-- Ground and text colour come from body in src/index.css. Setting them as
       classes here overrides the palette: `text-gray-200` beat `var(--on-ink)`
       on specificity and quietly made every default string cool grey. -->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
