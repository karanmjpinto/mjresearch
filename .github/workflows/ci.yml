name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-hedge-fund
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-hedge-fund/frontend/package-lock.json

      - name: npm ci & build
        working-directory: ai-hedge-fund/frontend
        run: |
          npm ci
          npm run build

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: rams-design/rams-action@v1
        with:
          api-key: ${{ secrets.RAMS_API_KEY }}
          fail-on: critical
