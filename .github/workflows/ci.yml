name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-hedge-fund
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # Scoped by `files` in pyproject; the list is a ratchet, widened one
      # package at a time. See [tool.mypy].
      - name: Mypy
        run: uv run mypy

      # The floor only ever moves up. It is deliberately set just under the
      # current number: the point is to stop a regression landing unnoticed, not
      # to bless the modules that are still thin.
      - name: Pytest
        run: uv run pytest --cov=src/hedge_fund --cov-report=term-missing --cov-fail-under=57

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-hedge-fund/frontend/package-lock.json

      - name: npm ci, test & build
        working-directory: ai-hedge-fund/frontend
        run: |
          npm ci
          npm run test
          npm run build

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # rams-action@v1 reads inputs as INPUT_API_KEY, but GitHub only converts
      # spaces to underscores, so `with: api-key` lands in INPUT_API-KEY and the
      # action never sees it. Pass the underscore names it looks for via env
      # until upstream fixes it; `with:` stays so this is already correct then.
      - uses: rams-design/rams-action@v1
        env:
          INPUT_API_KEY: ${{ secrets.RAMS_API_KEY }}
          INPUT_FAIL_ON: critical
        with:
          api-key: ${{ secrets.RAMS_API_KEY }}
          fail-on: critical
