name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ai-hedge-fund/frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # allow manual trigger from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; skip queued runs but don't cancel in-progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-hedge-fund/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ai-hedge-fund/frontend
        run: npm ci

      - name: Build (GitHub Pages base path)
        working-directory: ai-hedge-fund/frontend
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-hedge-fund/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
